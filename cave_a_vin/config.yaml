name: Tessvine
version: "1.18.0"
slug: cave_a_vin
description: Gérez votre cave à vin (inventaire, plan de cave, garde, dégustations) directement dans Home Assistant
url: https://github.com/Tessman404/cave-a-vin
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:glass-wine
panel_title: Tessvine
# la cave est partagée par tout le foyer : le panneau est visible aussi des comptes non administrateurs
# (tablette murale, autres membres de la famille). Options, clé d'API et réseau restent réservés aux administrateurs.
panel_admin: false
homeassistant_api: true
map:
  - type: media
    read_only: false
discovery:
  - cave_a_vin
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Accès direct à la cave depuis le réseau local (facultatif, l'accès par Home Assistant suffit)
options:
  api_key: ""
  log_level: info
schema:
  api_key: password?
  log_level: list(debug|info|warning|error)?
