<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9ece6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111916" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tessvine">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Tessvine</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-accueil" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-vins" viewBox="0 0 24 24"><path d="M10 2.5h4v5c0 1.5 3 2.7 3 6.2V20a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20v-6.3c0-3.5 3-4.7 3-6.2z"/><path d="M7.5 13.5h9v4h-9z"/></symbol>
    <symbol id="i-cave" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/><circle cx="16" cy="16" r="2"/></symbol>
    <symbol id="i-soir" viewBox="0 0 24 24"><path d="M7 3h10l-.6 6a4.4 4.4 0 0 1-8.8 0z"/><path d="M12 13.4V20M8.5 21h7"/></symbol>
    <symbol id="i-envies" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
    <symbol id="i-historique" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-reglages" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></symbol>
    <defs>
      <!-- verre cylindrique : bord sombre, reflet net en haut, reflet doux en bas -->
      <linearGradient id="g-verre" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".12" stop-color="#000" stop-opacity=".15"/>
        <stop offset=".2" stop-color="#fff" stop-opacity=".55"/><stop offset=".26" stop-color="#fff" stop-opacity=".12"/>
        <stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity=".18"/>
        <stop offset=".9" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
      </linearGradient>
      <!-- capsule métallisée -->
      <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset=".25" stop-color="#fff" stop-opacity=".7"/>
        <stop offset=".4" stop-color="#fff" stop-opacity=".15"/><stop offset=".7" stop-color="#000" stop-opacity=".15"/>
        <stop offset="1" stop-color="#000" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="g-or" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6e5317"/><stop offset=".22" stop-color="#f6e3a1"/><stop offset=".42" stop-color="#c9a646"/>
        <stop offset=".75" stop-color="#9c7b25"/><stop offset="1" stop-color="#5a4210"/>
      </linearGradient>
    </defs>
    <!-- bouteille de vin couchée, goulot vers l'avant-gauche : le verre prend currentColor, la capsule --capsule -->
    <symbol id="bouteille-couchee" viewBox="0 0 64 64">
      <g class="forme" transform="translate(30 31) rotate(-40) translate(-31 0)">
        <path d="M61,-12.5 L27,-12.5 C20,-12.5 18.5,-4.6 12.5,-4.1 L3,-4.1 L3,4.1 L12.5,4.1 C18.5,4.6 20,12.5 27,12.5 L61,12.5 C63.5,12.5 64.5,11 64.5,8.5 L64.5,-8.5 C64.5,-11 63.5,-12.5 61,-12.5 Z" fill="currentColor"/>
        <path d="M61,-12.5 L27,-12.5 C20,-12.5 18.5,-4.6 12.5,-4.1 L3,-4.1 L3,4.1 L12.5,4.1 C18.5,4.6 20,12.5 27,12.5 L61,12.5 C63.5,12.5 64.5,11 64.5,8.5 L64.5,-8.5 C64.5,-11 63.5,-12.5 61,-12.5 Z" fill="url(#g-verre)"/>
        <path d="M27,-8.6 L61,-8.6" stroke="#fff" stroke-opacity=".45" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M19,-7.5 C21.5,-10.2 24,-10.6 27,-10.6" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".9" stroke-linecap="round"/>
        <rect x="1.2" y="-4.6" width="13.3" height="9.2" rx="1.2" fill="var(--capsule, #3a0c18)"/>
        <rect x="1.2" y="-4.6" width="13.3" height="9.2" rx="1.2" fill="url(#g-metal)"/>
        <path d="M14.5,-4.6 L14.5,4.6" stroke="#000" stroke-opacity=".35" stroke-width=".7"/>
        <ellipse cx="1.4" cy="0" rx="1.5" ry="4.6" fill="var(--capsule, #3a0c18)"/>
        <ellipse cx="1.4" cy="0" rx="1.5" ry="4.6" fill="#000" fill-opacity=".25"/>
        <ellipse cx="1.1" cy="-1.6" rx=".5" ry="1.6" fill="#fff" fill-opacity=".45"/>
      </g>
    </symbol>
    <!-- bouteille de champagne : plus ronde, collerette dorée, bouchon champignon et muselet -->
    <symbol id="bouteille-champagne" viewBox="0 0 64 64">
      <g class="forme" transform="translate(30 31) rotate(-40) translate(-30 0)">
        <path d="M61,-14 L31,-14 C23,-14 20.5,-6 14.5,-5 L4.5,-5 L4.5,5 L14.5,5 C20.5,6 23,14 31,14 L61,14 C63.8,14 64.8,12.3 64.8,9.5 L64.8,-9.5 C64.8,-12.3 63.8,-14 61,-14 Z" fill="currentColor"/>
        <path d="M61,-14 L31,-14 C23,-14 20.5,-6 14.5,-5 L4.5,-5 L4.5,5 L14.5,5 C20.5,6 23,14 31,14 L61,14 C63.8,14 64.8,12.3 64.8,9.5 L64.8,-9.5 C64.8,-12.3 63.8,-14 61,-14 Z" fill="url(#g-verre)"/>
        <path d="M31,-9.6 L61,-9.6" stroke="#fff" stroke-opacity=".4" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M3.5,-5.6 L15,-5.6 C18.5,-6.4 20.5,-9.5 23.5,-11.4 L25.5,-9.6 L23.8,-7.8 L25.6,-5.9 L23.9,-4 L25.7,-2 L23.9,0 L25.7,2 L23.9,4 L25.6,5.9 L23.8,7.8 L25.5,9.6 L23.5,11.4 C20.5,9.5 18.5,6.4 15,5.6 L3.5,5.6 Z" fill="url(#g-or)"/>
        <path d="M5,-5.6 L5,5.6 M9,-5.6 L9,5.6" stroke="#5a4210" stroke-opacity=".55" stroke-width=".5"/>
        <path d="M0.8,-3.6 L8.5,-5.4 M0.8,3.6 L8.5,5.4 M0.2,0 L8.5,0" stroke="#d8d8d8" stroke-width=".55"/>
        <ellipse cx="2" cy="0" rx="2.4" ry="5.9" fill="url(#g-or)"/>
        <ellipse cx="0.6" cy="0" rx="1.1" ry="3" fill="#f3e6b8"/>
        <ellipse cx="0.6" cy="0" rx="1.1" ry="3" fill="none" stroke="#7a5d1a" stroke-width=".4"/>
      </g>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-autres" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></symbol>
  </svg>

  <header class="barre">
    <a class="logo" href="#/"><img src="icon.svg" alt=""> <span>Tessvine</span></a>
    <nav id="menu" aria-label="Navigation principale">
      <a href="#/" data-page="accueil"><svg><use href="#i-accueil"/></svg><span>Accueil</span></a>
      <a href="#/vins" data-page="vins"><svg><use href="#i-vins"/></svg><span>Mes vins</span></a>
      <a href="#/caves" data-page="caves"><svg><use href="#i-cave"/></svg><span>Plan de cave</span></a>
      <a href="#/ajouter" data-page="ajouter" class="onglet-ajouter" aria-label="Ajouter un vin"><svg><use href="#i-plus"/></svg><span>Ajouter</span></a>
      <a href="#/ce-soir" data-page="ce-soir"><svg><use href="#i-soir"/></svg><span>Mets &amp; Vins</span></a>
      <a href="#/envies" data-page="envies" class="secondaire"><svg><use href="#i-envies"/></svg><span>Envies</span></a>
      <a href="#/historique" data-page="historique" class="secondaire"><svg><use href="#i-historique"/></svg><span>Historique</span></a>
      <a href="#/reglages" data-page="reglages" class="secondaire"><svg><use href="#i-reglages"/></svg><span>Réglages</span></a>
      <button type="button" id="autres" class="seul-mobile" aria-label="Plus de pages"><svg><use href="#i-autres"/></svg><span>Plus</span></button>
    </nav>
    <a class="bouton primaire ajouter" href="#/ajouter"><svg><use href="#i-plus"/></svg> Ajouter un vin</a>
  </header>
  <main id="page" aria-live="polite"></main>
  <div id="toast" role="status"></div>
  <dialog id="dialogue"></dialog>
  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
