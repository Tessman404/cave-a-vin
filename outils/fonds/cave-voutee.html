<!doctype html><html><body style="margin:0;background:#000">
<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
<defs>

  <filter id="flou"><feGaussianBlur stdDeviation="9"/></filter>

<rect width="900" height="1200" fill="url(#lumiere)"/>

  <use href="#casier" transform="translate(900 0) scale(-1 1)"/>

  <ellipse cx="450" cy="760" rx="150" ry="150" fill="#3a2212"/>

<!-- halo chaud derrière le sujet -->
<rect width="900" height="980" fill="url(#halo)"/>
<!-- plateau en bois où pose la bouteille -->
